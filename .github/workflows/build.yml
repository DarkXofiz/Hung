name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Yeni surum eklemek icin buraya satir ekle (degerleri fabricmc.net/develop'tan al)
          - mc: "1.20.1"
            yarn: "1.20.1+build.10"
            fabric: "0.92.2+1.20.1"
            java: "17"
          - mc: "1.21.1"   # 1.21 ve 1.21.1 icin
            yarn: "1.21.1+build.3"
            fabric: "0.116.17+1.21.1"
            java: "21"
          - mc: "1.21.4"
            yarn: "1.21.4+build.8"
            fabric: "0.119.4+1.21.4"
            java: "21"
    steps:
      - uses: actions/checkout@v4

      # JDK 21 ile derlenir, hedef bytecode java_version ile belirlenir
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build ${{ matrix.mc }}
        run: >
          gradle clean build
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Pfabric_version=${{ matrix.fabric }}
          -Pjava_version=${{ matrix.java }}

      - uses: actions/upload-artifact@v4
        with:
          name: hung-mc${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
